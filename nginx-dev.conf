server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # 访问日志
    access_log /tmp/mrdoc_access.log;
    error_log /tmp/mrdoc_error.log;

    # 根路径重定向到 /mrdoc/
    location = / {
        return 301 /mrdoc/;
    }

    # MrDoc 应用路径
    location /mrdoc/ {
        # 重写路径，去掉 /mrdoc 前缀再转发给 Django
        rewrite ^/mrdoc/(.*)$ /$1 break;
        
        # 如果在容器中运行 nginx，使用 host.docker.internal 访问宿主机
        # 如果在宿主机运行 nginx，使用 127.0.0.1
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Script-Name /mrdoc;
        
        # 超时设置
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # 静态文件
    location /mrdoc/static/ {
        alias /Users/lizonglun/code/MrDocTest/static/;
        expires 30d;
    }

    # 媒体文件
    location /mrdoc/media/ {
        alias /Users/lizonglun/code/MrDocTest/media/;
        expires 30d;
    }
}
